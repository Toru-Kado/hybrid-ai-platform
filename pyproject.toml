[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-ai-platform"
version = "0.1.0"
description = "Hybrid AI platform using Python, AWS CDK, AWS Bedrock, and Claude."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.34.122,<2.0.0",
]

[project.scripts]
hybrid-assistant = "app.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app*"]
