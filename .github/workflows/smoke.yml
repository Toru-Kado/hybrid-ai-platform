name: Smoke

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  local-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install app dependencies
        run: make bootstrap

      - name: Install infra dependencies
        run: make infra-bootstrap

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Run local smoke checks
        run: make smoke

      - name: Run E2E integration tests
        run: make test-e2e

  live-bedrock-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: local-smoke
    runs-on: ubuntu-latest
    env:
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      SMOKE_AWS_REGION: ${{ vars.SMOKE_AWS_REGION }}
      SMOKE_BEDROCK_INFERENCE_PROFILE_ARN: ${{ vars.SMOKE_BEDROCK_INFERENCE_PROFILE_ARN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app dependencies
        run: make bootstrap

      - name: Skip live Bedrock smoke check
        if: ${{ env.AWS_ROLE_TO_ASSUME == '' || env.SMOKE_BEDROCK_INFERENCE_PROFILE_ARN == '' }}
        run: echo "Skipping live Bedrock smoke check because AWS_ROLE_TO_ASSUME or SMOKE_BEDROCK_INFERENCE_PROFILE_ARN is not configured."

      - name: Configure AWS credentials
        if: ${{ env.AWS_ROLE_TO_ASSUME != '' && env.SMOKE_BEDROCK_INFERENCE_PROFILE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.SMOKE_AWS_REGION != '' && env.SMOKE_AWS_REGION || 'us-east-1' }}

      - name: Write smoke env file
        if: ${{ env.AWS_ROLE_TO_ASSUME != '' && env.SMOKE_BEDROCK_INFERENCE_PROFILE_ARN != '' }}
        run: |
          cat > .env.ci <<EOF
          AI_PROVIDER=bedrock
          AWS_REGION=${SMOKE_AWS_REGION:-us-east-1}
          BEDROCK_INFERENCE_PROFILE_ARN=${SMOKE_BEDROCK_INFERENCE_PROFILE_ARN}
          MODEL_MAX_TOKENS=64
          MODEL_TEMPERATURE=0
          BEDROCK_GUARDRAIL_MODE=off
          EOF

      - name: Run live Bedrock smoke check
        if: ${{ env.AWS_ROLE_TO_ASSUME != '' && env.SMOKE_BEDROCK_INFERENCE_PROFILE_ARN != '' }}
        run: .venv/bin/python scripts/smoke.py bedrock --env-file .env.ci

  deployed-stack-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: local-smoke
    runs-on: ubuntu-latest
    env:
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      SMOKE_AWS_REGION: ${{ vars.SMOKE_AWS_REGION }}
      SMOKE_STACK_NAME: ${{ vars.SMOKE_STACK_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app dependencies
        run: make bootstrap

      - name: Skip deployed stack smoke check
        if: ${{ env.AWS_ROLE_TO_ASSUME == '' }}
        run: echo "Skipping deployed stack smoke check because AWS_ROLE_TO_ASSUME is not configured."

      - name: Configure AWS credentials
        if: ${{ env.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.SMOKE_AWS_REGION != '' && env.SMOKE_AWS_REGION || 'us-east-1' }}

      - name: Run deployed stack smoke check
        if: ${{ env.AWS_ROLE_TO_ASSUME != '' }}
        run: .venv/bin/python scripts/smoke.py stack --aws-region "${SMOKE_AWS_REGION:-us-east-1}" --stack-name "${SMOKE_STACK_NAME:-HybridAiPlatformBaseline}"
